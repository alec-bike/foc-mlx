[project]
name = "foc-mlx"
version = "0.2.0"
description = "Field Oriented Control transforms optimized for Apple Silicon."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mlx>=0.32.3"]

[dependency-groups]
dev = [
  "altair>=6.3.0",
  "polars[numpy]>=2.0.0rc2",
  "pytest>=9.1.1",
]
tool = ["poethepoet", "ruff", "ty"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.poe.tasks]
format = "ruff format"
lint = "ruff check"
ty = "ty check"
pytest = "pytest -q"

[tool.poe.tasks.ci]
sequence = ["format", "lint", "ty", "pytest"]

[tool.ruff]
preview = true
line-length = 100

[tool.ruff.lint]
pydocstyle.convention = "google"
extend-select = [
  "commented-out-code",
  "pytest-incorrect-pytest-import",
  "pytest-composite-assertion",
]

[tool.uv]
preview-features = true
audit.malware-check = true

# [1]: https://docs.astral.sh/ruff/rules
