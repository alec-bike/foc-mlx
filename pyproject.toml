[project]
name = "foc-mlx"
version = "0.2.0"
description = "Field Oriented Control transforms optimized for Apple Silicon."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mlx>=0.32.4"]

[dependency-groups]
dev = ["pytest>=9.1"]
tool = ["poethepoet", "ruff", "ty"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.poe.tasks]
format = "ruff format"
lint = "ruff check"
type = "uv check"
pytest = "pytest -v"

[tool.poe.tasks.ci]
sequence = ["format", "lint", "type", "pytest"]

[tool.ruff]
preview = true
line-length = 100

[tool.ruff.lint]
pydocstyle.convention = "google"
extend-select = [
  "commented-out-code",
  "pytest-incorrect-pytest-import",
  "pytest-composite-assertion",
]

[tool.ty]
analysis.return-type-inference = "always"

[tool.uv]
preview-features = true
audit.malware-check = true
