[project]
name = "foc-mlx"
version = "0.2.0"
description = "Field Oriented Control transforms optimized for Apple Silicon."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mlx>=0.32.4"]

[dependency-groups]
dev = [
  "altair>=6.3",
  "polars[numpy]>=2.1",
  "pytest>=9.2",
  "ruff>=0.17",
  "ty>=0.0.95",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
preview = true
line-length = 100

[tool.ruff.lint]
pydocstyle.convention = "google"
extend-select = [
  "commented-out-code",
  "pytest-incorrect-pytest-import",
  "pytest-composite-assertion",
]

[tool.ty]
environment.python-version = "3.12"

[tool.uv]
preview-features = true
