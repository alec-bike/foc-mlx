name: Linux CI testing

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  testing:
    name: Setup and run hooks
    runs-on: ubuntu-slim

    steps:
      - name: Checkout foc-mlx codebase
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - name: Setup python
        run: uv python install

      - name: Install dependencies
        run: |
          uv sync
          uv pip install mlx-cpu

      - name: ruff
        run: |
          uv run ruff check
          uv run ruff format

      - name: ty
        run: |
          uv run ty check src tests

      - name: pytest
        run: |
          uv run pytest --cov
