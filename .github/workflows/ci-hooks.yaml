name: Linux CI testing

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  testing:
    name: Setup repository and run CI tasks
    runs-on: ubuntu-slim

    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv pip install mlx-cpu

      - name: Run CI tasks
        run: |
          uv run poe ci
