name: Linux CI testing

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-slim
    name: Setup and run hooks
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup python
        run: uv python install

      - name: Install dependencies
        run: |
          uv sync

      - name: Add linux mlx dependency
        run: |
          uv pip install mlx[cpu]

      - name: ruff check
        run: |
          uvx ruff check

      - name: ruff format
        run: |
          uvx ruff format

      - name: ty check
        run: |
          uvx ty check

      - name: pytest
        run: |
          uv run pytest --cov
