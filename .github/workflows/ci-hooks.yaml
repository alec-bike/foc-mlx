name: Linux CI testing

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  testing:
    name: Setup repository and run tasks
    runs-on: ubuntu-slim

    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv pip install mlx-cpu
          uv tool install ruff

      - name: Run tasks
        run: |
          ruff format --check
          ruff check
          uv check
          uv run pytest
